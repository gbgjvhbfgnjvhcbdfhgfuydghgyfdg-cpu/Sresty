<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonArcade - Unblocked Games Hub</title>
    <meta name="description" content="Play classic web arcade games like 2048, Snake, Pong, Breakout, and Flappy Bird embedded in high-performance iframes with fullscreen mode, search, and custom game support." />
    <meta property="og:title" content="NeonArcade - Unblocked Games Hub" />
    <meta property="og:description" content="Play classic web arcade games like 2048, Snake, Pong, Breakout, and Flappy Bird embedded in high-performance iframes with fullscreen mode, search, and custom game support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root">
      <!-- Loading indicator while Vite bundle initializes -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
          <div style="width: 22px; height: 22px; border: 3px solid #06b6d4; border-top-color: transparent; border-radius: 50%; animation: arcade-spin 0.8s linear infinite;"></div>
          <span style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.025em; background: linear-gradient(135deg, #22d3ee, #a855f7); -webkit-background-clip: text; color: transparent;">NeonArcade</span>
        </div>
        <p style="font-size: 0.875rem; color: #94a3b8; font-weight: 500;">Powering up the arcade...</p>
        <noscript>
          <p style="margin-top: 1rem; color: #ef4444; font-size: 0.875rem; text-align: center;">JavaScript is required to launch NeonArcade. Please enable JavaScript in your browser.</p>
        </noscript>
      </div>
      <style>
        @keyframes arcade-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <!-- Entry point for the Vite React Application -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
