<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .score-board {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #131c2e;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 6px 18px;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .player-score { color: #38bdf8; }
    .ai-score { color: #ec4899; }
    .divider { color: #64748b; font-size: 16px; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 16 / 10;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      background: #0b111e;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .overlay-sub {
      font-size: 14px;
      color: #94a3b8;
    }
    .btn {
      background: #38bdf8;
      color: #090d16;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #7dd3fc;
      transform: scale(1.04);
    }
    .controls-help {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">PONG CLASSIC</div>
    <div class="score-board">
      <span class="player-score" id="playerScore">0</span>
      <span class="divider">:</span>
      <span class="ai-score" id="aiScore">0</span>
    </div>
  </div>

  <div class="canvas-container" id="container">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlayTitle" class="overlay-title">PONG CLASSIC</div>
      <div id="overlaySub" class="overlay-sub">First to 7 points wins the match</div>
      <button id="startBtn" class="btn">Start Game</button>
    </div>
  </div>

  <div class="controls-help">
    Use <strong>Mouse</strong>, <strong>Arrow Keys</strong> or <strong>W/S</strong> to control paddle
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const playerScoreEl = document.getElementById('playerScore');
    const aiScoreEl = document.getElementById('aiScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const WINNING_SCORE = 7;
    let playerScore = 0;
    let aiScore = 0;
    let isPlaying = false;

    const paddleWidth = 12;
    const paddleHeight = 70;

    let playerY = (canvas.height - paddleHeight) / 2;
    let aiY = (canvas.height - paddleHeight) / 2;
    let targetPlayerY = playerY;

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 5,
      vy: 3,
      radius: 6,
      speed: 6
    };

    let particles = [];

    // Web Audio Sound FX
    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playTone(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1,
          color
        });
      }
    }

    function resetBall(servingPlayer) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 6;
      const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
      const dir = servingPlayer === 'player' ? 1 : -1;
      ball.vx = dir * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    function startGame() {
      playerScore = 0;
      aiScore = 0;
      playerScoreEl.textContent = '0';
      aiScoreEl.textContent = '0';
      isPlaying = true;
      overlay.classList.add('hidden');
      resetBall('player');
      requestAnimationFrame(loop);
    }

    function endGame(winner) {
      isPlaying = false;
      playTone(winner === 'Player' ? 520 : 160, 'sawtooth', 0.4);
      overlayTitle.textContent = winner === 'Player' ? 'VICTORY!' : 'DEFEAT';
      overlayTitle.style.color = winner === 'Player' ? '#38bdf8' : '#ec4899';
      overlaySub.textContent = `Final Score: ${playerScore} - ${aiScore}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function update() {
      // Smooth player paddle interpolation
      playerY += (targetPlayerY - playerY) * 0.35;
      playerY = Math.max(0, Math.min(canvas.height - paddleHeight, playerY));

      // AI paddle
      const aiCenter = aiY + paddleHeight / 2;
      if (ball.vx > 0) {
        // AI tracks ball with slight human imperfection
        const targetAi = ball.y - paddleHeight / 2;
        aiY += (targetAi - aiY) * 0.12;
      } else {
        // Return to center
        aiY += (canvas.height / 2 - paddleHeight / 2 - aiY) * 0.05;
      }
      aiY = Math.max(0, Math.min(canvas.height - paddleHeight, aiY));

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / Bottom wall bounce
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy = -ball.vy;
        playTone(320, 'sine', 0.05);
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy = -ball.vy;
        playTone(320, 'sine', 0.05);
      }

      // Left paddle collision (Player)
      const pLeft = 20;
      const pRight = 20 + paddleWidth;
      if (ball.x - ball.radius <= pRight && ball.x + ball.radius >= pLeft) {
        if (ball.y >= playerY && ball.y <= playerY + paddleHeight) {
          ball.x = pRight + ball.radius;
          const hitOffset = (ball.y - (playerY + paddleHeight / 2)) / (paddleHeight / 2);
          const angle = hitOffset * (Math.PI / 3);
          ball.speed = Math.min(12, ball.speed + 0.3);
          ball.vx = ball.speed * Math.cos(angle);
          ball.vy = ball.speed * Math.sin(angle);
          playTone(440, 'triangle', 0.08);
          spawnParticles(ball.x, ball.y, '#38bdf8');
        }
      }

      // Right paddle collision (AI)
      const aiLeft = canvas.width - 20 - paddleWidth;
      const aiRight = canvas.width - 20;
      if (ball.x + ball.radius >= aiLeft && ball.x - ball.radius <= aiRight) {
        if (ball.y >= aiY && ball.y <= aiY + paddleHeight) {
          ball.x = aiLeft - ball.radius;
          const hitOffset = (ball.y - (aiY + paddleHeight / 2)) / (paddleHeight / 2);
          const angle = hitOffset * (Math.PI / 3);
          ball.speed = Math.min(12, ball.speed + 0.3);
          ball.vx = -ball.speed * Math.cos(angle);
          ball.vy = ball.speed * Math.sin(angle);
          playTone(400, 'triangle', 0.08);
          spawnParticles(ball.x, ball.y, '#ec4899');
        }
      }

      // Check scoring
      if (ball.x < 0) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        playTone(200, 'sawtooth', 0.15);
        if (aiScore >= WINNING_SCORE) {
          endGame('Computer');
        } else {
          resetBall('ai');
        }
      } else if (ball.x > canvas.width) {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        playTone(550, 'triangle', 0.15);
        if (playerScore >= WINNING_SCORE) {
          endGame('Player');
        } else {
          resetBall('player');
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Player Paddle
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(20, playerY, paddleWidth, paddleHeight, 6);
      ctx.fill();
      ctx.restore();

      // AI Paddle
      ctx.save();
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.roundRect(canvas.width - 20 - paddleWidth, aiY, paddleWidth, paddleHeight, 6);
      ctx.fill();
      ctx.restore();

      // Ball
      ctx.save();
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    function loop() {
      if (!isPlaying) return;
      update();
      render();
      requestAnimationFrame(loop);
    }

    // Mouse & Touch tracking
    function updatePaddleFromEvent(clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const relativeY = (clientY - rect.top) * scaleY;
      targetPlayerY = relativeY - paddleHeight / 2;
    }

    container.addEventListener('mousemove', (e) => {
      updatePaddleFromEvent(e.clientY);
    });

    container.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches[0]) updatePaddleFromEvent(e.touches[0].clientY);
    }, { passive: false });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        targetPlayerY -= 25;
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        targetPlayerY += 25;
      }
    });

    startBtn.addEventListener('click', startGame);
    render();
  </script>
</body>
</html>
