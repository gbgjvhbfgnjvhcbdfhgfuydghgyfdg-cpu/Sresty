<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1e293b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #22c55e;
      letter-spacing: -0.5px;
    }
    .stats { display: flex; gap: 8px; }
    .stat {
      background: #0f172a;
      border-radius: 6px;
      padding: 4px 12px;
      text-align: center;
    }
    .stat-label { font-size: 9px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .stat-val { font-size: 16px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums; }
    
    .canvas-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #0f172a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 32px; font-weight: 800; color: #22c55e; }
    .overlay-sub { font-size: 14px; color: #94a3b8; }
    .btn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #4ade80; }
    .footer-help { margin-top: 12px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">SNAKE</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
      <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="bestScore">0</div></div>
    </div>
  </div>

  <div class="canvas-box">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlayTitle" class="overlay-title">SNAKE</div>
      <div id="overlaySub" class="overlay-sub">Collect red apples to grow</div>
      <button id="startBtn" class="btn">Play Game</button>
    </div>
  </div>

  <div class="footer-help">
    Use <strong>Arrow Keys</strong> or <strong>WASD</strong> · <strong>Space</strong> to Pause
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('classic_snake_best') || '0', 10);
    bestScoreEl.textContent = bestScore;

    let isPlaying = false;
    let isPaused = false;
    let gameLoopTimeout = null;

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    function resetGame() {
      snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
      isPlaying = true;
      isPaused = false;
      overlay.classList.add('hidden');
      tick();
    }

    function gameOver() {
      isPlaying = false;
      clearTimeout(gameLoopTimeout);
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('classic_snake_best', bestScore);
      }
      overlayTitle.textContent = 'GAME OVER';
      overlaySub.textContent = `Score: ${score} · Best: ${bestScore}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function tick() {
      if (!isPlaying || isPaused) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
      const speed = Math.max(60, 110 - Math.floor(score / 50) * 5);
      gameLoopTimeout = setTimeout(tick, speed);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle checkered retro grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#111c2e' : '#0f172a';
          ctx.fillRect(c * GRID, r * GRID, GRID, GRID);
        }
      }

      // Red Apple
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID, (food.y + 0.5) * GRID, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake Body
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#22c55e' : '#16a34a';
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();
      });
    }

    function setDirection(d) {
      if (d === 'up' && dir.y !== 1) nextDir = { x: 0, y: -1 };
      if (d === 'down' && dir.y !== -1) nextDir = { x: 0, y: 1 };
      if (d === 'left' && dir.x !== 1) nextDir = { x: -1, y: 0 };
      if (d === 'right' && dir.x !== -1) nextDir = { x: 1, y: 0 };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDirection('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDirection('down'); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDirection('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDirection('right'); }
      else if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) {
          isPaused = !isPaused;
          if (!isPaused) tick();
        }
      }
    });

    startBtn.addEventListener('click', resetGame);
    draw();
  </script>
</body>
</html>
