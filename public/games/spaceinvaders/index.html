<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxy Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title { font-size: 20px; font-weight: 800; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    .stats { display: flex; gap: 10px; }
    .stat {
      background: #131c2e;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
    }
    .stat-label { font-size: 9px; text-transform: uppercase; color: #94a3b8; }
    .stat-val { font-size: 15px; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      background: #060b17;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 28px; font-weight: 800; color: #38bdf8; }
    .overlay-sub { font-size: 13px; color: #94a3b8; }
    .btn {
      background: #38bdf8;
      color: #090d16;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: all 0.15s ease;
    }
    .btn:hover { background: #7dd3fc; transform: scale(1.04); }
    .help { margin-top: 10px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">GALAXY DEFENDER</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
      <div class="stat"><div class="stat-label">Wave</div><div class="stat-val" id="wave">1</div></div>
      <div class="stat"><div class="stat-label">Lives</div><div class="stat-val" id="lives">3</div></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="480" height="360"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlayTitle" class="overlay-title">GALAXY DEFENDER</div>
      <div id="overlaySub" class="overlay-sub">Defend Earth from alien invader waves</div>
      <button id="startBtn" class="btn">Deploy Cannon</button>
    </div>
  </div>

  <div class="help">
    Use <strong>Left/Right Arrows</strong> or <strong>A/D</strong> to steer · <strong>Spacebar</strong> to fire
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let wave = 1;
    let lives = 3;
    let isPlaying = false;

    const player = {
      x: canvas.width / 2 - 14,
      y: canvas.height - 30,
      w: 28,
      h: 16,
      speed: 4,
      dx: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let enemyDir = 1;
    let enemySpeed = 1;
    let particles = [];
    let lastShoot = 0;

    // Web Audio Sound FX
    const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
      ? new (window.AudioContext || window.webkitAudioContext)()
      : null;

    function playTone(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initEnemies() {
      enemies = [];
      const rows = 4;
      const cols = 8;
      const startX = 40;
      const startY = 40;
      const spacingX = 48;
      const spacingY = 28;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: startX + c * spacingX,
            y: startY + r * spacingY,
            w: 24,
            h: 18,
            alive: true,
            type: r,
            color: ['#ec4899', '#a855f7', '#06b6d4', '#10b981'][r]
          });
        }
      }
      enemySpeed = 0.8 + wave * 0.2;
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 1,
          color
        });
      }
    }

    function startGame() {
      score = 0;
      wave = 1;
      lives = 3;
      bullets = [];
      enemyBullets = [];
      particles = [];
      scoreEl.textContent = '0';
      waveEl.textContent = '1';
      livesEl.textContent = '3';
      initEnemies();
      isPlaying = true;
      overlay.classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function gameOver(won) {
      isPlaying = false;
      playTone(won ? 520 : 130, 'sawtooth', 0.4);
      overlayTitle.textContent = won ? 'VICTORY!' : 'MISSION FAILED';
      overlayTitle.style.color = won ? '#10b981' : '#f43f5e';
      overlaySub.textContent = `Score: ${score} · Final Wave: ${wave}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function update() {
      // Move player
      player.x += player.dx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      // Player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= 7;
        if (b.y < 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Enemy collision
        for (const e of enemies) {
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(i, 1);
            score += (4 - e.type) * 20;
            scoreEl.textContent = score;
            playTone(480 + (4 - e.type) * 50, 'triangle', 0.08);
            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.color);
            break;
          }
        }
      }

      // Check wave clear
      const aliveEnemies = enemies.filter(e => e.alive);
      if (aliveEnemies.length === 0) {
        wave++;
        waveEl.textContent = wave;
        playTone(600, 'sine', 0.2);
        initEnemies();
        return;
      }

      // Move enemies
      let hitEdge = false;
      for (const e of aliveEnemies) {
        e.x += enemyDir * enemySpeed;
        if (e.x <= 15 || e.x + e.w >= canvas.width - 15) {
          hitEdge = true;
        }
        // Invaders reached bottom
        if (e.y + e.h >= player.y) {
          return gameOver(false);
        }
      }

      if (hitEdge) {
        enemyDir = -enemyDir;
        for (const e of aliveEnemies) {
          e.y += 10;
        }
      }

      // Random enemy shooting
      if (Math.random() < 0.035 && aliveEnemies.length > 0) {
        const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, vy: 3 });
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.vy;
        if (eb.y > canvas.height) {
          enemyBullets.splice(i, 1);
          continue;
        }

        // Player collision
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          playTone(160, 'sawtooth', 0.2);
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#38bdf8');
          if (lives <= 0) {
            return gameOver(false);
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 47) % canvas.width;
        const sy = (i * 83) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Player Ship
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Enemies
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.roundRect(e.x, e.y, e.w, e.h, 4);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#060b17';
        ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 4, 4, 4);
        ctx.restore();
      });

      // Player Lasers
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 1.5, b.y, 3, 10);
      });
      ctx.restore();

      // Enemy Bullets
      ctx.save();
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#f43f5e';
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    function loop() {
      if (!isPlaying) return;
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (!isPlaying) return;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) player.dx = -player.speed;
      else if (['ArrowRight', 'KeyD'].includes(e.code)) player.dx = player.speed;
      else if (e.code === 'Space') {
        e.preventDefault();
        const now = performance.now();
        if (now - lastShoot > 220) {
          lastShoot = now;
          bullets.push({ x: player.x + player.w / 2, y: player.y });
          playTone(620, 'square', 0.04);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) {
        player.dx = 0;
      }
    });

    startBtn.addEventListener('click', startGame);
    initEnemies();
    render();
  </script>
</body>
</html>
